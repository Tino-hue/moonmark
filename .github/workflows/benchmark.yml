name: Benchmark

# =============================================================================
# 性能基准工作流
# 触发条件：
#   - 手动触发（workflow_dispatch）：对比任意两次 commit 的性能
#   - push 到 release/* 分支：发布前做性能回退检测
#   - pull_request（含 benchmark label）：PR 需要做性能审查
#
# 功能：
#   - 运行 moon test --target js --no-skip（开启 8 个性能基准）
#   - 把基准结果上传为 artifact，便于归档对比
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      extra_args:
        description: "额外 moon test 参数（如 --test-threads 1）"
        required: false
        default: ""
  push:
    branches:
      - "release/*"

permissions:
  contents: read

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install MoonBit (mirror chain CN → INT)
        run: |
          INSTALL_OK=0
          MIRRORS=(
            "cli.moonbitlang.cn"
            "cli.moonbitlang.com"
          )
          for MIRROR in "${MIRRORS[@]}"; do
            echo "━━━ Installing MoonBit via: https://$MIRROR ━━━"
            if curl \
                --connect-timeout 10 \
                --max-time 180 \
                --retry 3 \
                --retry-delay 3 \
                --retry-connrefused \
                -fsSL "https://$MIRROR/install/unix.sh" | bash; then
              INSTALL_OK=1
              break
            else
              echo "  ✗ mirror $MIRROR install failed, trying next mirror (if any)"
              rm -rf "$HOME/.moon" 2>/dev/null || true
            fi
          done

          if [ "$INSTALL_OK" -ne 1 ]; then
            echo "✗ MoonBit CLI 安装失败：所有镜像都不可用"
            exit 1
          fi

          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Environment info
        run: |
          echo "--- Hardware ---"
          nproc 2>/dev/null || echo "CPU: (unknown)"
          free -h 2>/dev/null || echo "MEM: (unknown)"
          echo "--- Software ---"
          moon version --all
          node --version

      - name: Build (warm up cache)
        run: |
          n=0
          until [ $n -ge 3 ]; do
            if moon update; then
              break
            fi
            n=$((n+1))
            echo "  ⚠ moon update 尝试 $n/3 失败，5s 后重试..."
            sleep 5
          done
          [ $n -ge 3 ] && { echo "✗ moon update 连续失败 3 次"; exit 1; }
          moon build --target js

      - name: Run full benchmark tests
        id: bench
        run: |
          mkdir -p benchmark-results
          LOG_FILE="benchmark-results/benchmark_$(date +%Y%m%d_%H%M%S).log"
          echo "Writing benchmark output to: $LOG_FILE"

          {
            echo "=== MoonBit Depsight Benchmark Run ==="
            echo "Date:    $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "Commit:  ${GITHUB_SHA:0:12}"
            echo "Branch:  ${GITHUB_REF_NAME}"
            echo "Runner:  $(uname -a)"
            echo "======================================"
            echo ""
          }  >  "$LOG_FILE"

          if moon test --target js --no-skip ${{ inputs.extra_args }} 2>&1 | tee -a "$LOG_FILE"; then
            echo "bench_status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "bench_status=FAIL" >> "$GITHUB_OUTPUT"
          fi

          echo ""
          echo "=== Last 20 lines of summary ==="
          tail -20 "$LOG_FILE"

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}-${{ github.sha }}
          path: benchmark-results/
          retention-days: 30
