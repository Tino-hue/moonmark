name: Depsight Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 每周一凌晨 3 点自动运行
    - cron: "0 3 * * 1"

jobs:
  depsight-audit:
    name: Dependency Health Audit
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup MoonBit
        env:
          MOONBIT_INSTALL_VERSION: "0.1.20260529"
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Format check (deny-warn equivalent)
        run: moon fmt --check --warn

      - name: Type check (deny-warn)
        run: moon check --target js --deny-warn

      - name: Generate interface
        run: moon info

      - name: Build depsight
        run: |
          moon build --target js

      - name: Run depsight audit
        run: |
          node _build/js/debug/build/depsight.js audit --html -o depsight-report.html --fail-on-score 70 --fail-on-critical

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: depsight-report
          path: depsight-report.html
