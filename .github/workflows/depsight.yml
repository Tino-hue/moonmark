name: Depsight Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 每周一凌晨 3 点自动运行
    - cron: "0 3 * * 1"

jobs:
  depsight-audit:
    name: Dependency Health Audit
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      # 说明：GitHub Hosted Runners 在美国，国内镜像 cli.moonbitlang.cn 可能 5min
      #       超时 curl 28。采用「国内 → 国际」双镜像链 + curl 超时重试，任一成功即可。
      #       之前单镜像的情况：国际镜像 cli.moonbitlang.com 有时 403 → 国内回退能覆盖。
      - name: Setup MoonBit (mirror chain CN → INT)
        run: |
          INSTALL_OK=0
          MIRRORS=(
            "cli.moonbitlang.cn"
            "cli.moonbitlang.com"
          )
          for MIRROR in "${MIRRORS[@]}"; do
            echo "━━━ Installing MoonBit via: https://$MIRROR ━━━"
            if curl \
                --connect-timeout 10 \
                --max-time 180 \
                --retry 3 \
                --retry-delay 3 \
                --retry-connrefused \
                -fsSL "https://$MIRROR/install/unix.sh" | bash; then
              INSTALL_OK=1
              break
            else
              echo "  ✗ mirror $MIRROR install failed, trying next mirror (if any)"
              rm -rf "$HOME/.moon" 2>/dev/null || true
            fi
          done

          if [ "$INSTALL_OK" -ne 1 ]; then
            echo "✗ MoonBit CLI 安装失败：所有镜像都不可用"
            exit 1
          fi

          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon update (retry)
        run: |
          n=0
          until [ $n -ge 3 ]; do
            if moon update; then
              exit 0
            fi
            n=$((n+1))
            echo "  ⚠ moon update 尝试 $n/3 失败，5s 后重试..."
            sleep 5
          done
          echo "✗ moon update 连续失败 3 次"
          exit 1

      # 1. moon fmt — 格式检查（不支持 --deny-warn，用 --check 替代）
      - name: Format check (deny-warn equivalent)
        run: moon fmt --check

      # 2. moon check — 类型检查
      - name: Type check
        run: moon check --target js

      # 3. moon info — 生成接口（不支持 --deny-warn）
      - name: Generate interface
        run: moon info

      # 4. moon test — 测试
      - name: Run tests
        run: moon test --target js

      - name: Build depsight
        run: |
          moon build --target js

      - name: Run depsight audit
        run: |
          node _build/js/debug/build/depsight.js audit --html -o depsight-report.html --fail-on-score 70 --fail-on-critical

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: depsight-report
          path: depsight-report.html
