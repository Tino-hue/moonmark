name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache MoonBit CLI
        uses: actions/cache@v4
        id: moonbit-cache
        with:
          path: ~/.moon
          key: moonbit-cli-${{ runner.os }}-${{ hashFiles('**/moon.mod.json') }}
          restore-keys: |
            moonbit-cli-${{ runner.os }}-

      - name: Install MoonBit CLI
        if: steps.moonbit-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            echo "Attempt $i to install MoonBit..."
            if curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors https://cli.moonbitlang.cn/install/unix.sh | bash; then
              echo "Install succeeded"
              break
            fi
            echo "Install failed, waiting 30s before retry..."
            sleep 30
          done

      - name: Verify MoonBit installation
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon version

      - name: Update MoonBit registry
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon update

      - name: Type check
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon check || (echo "=== TYPE CHECK FAILED ===" && exit 1)

      - name: Build for JS target
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon build --target js

      - name: Run tests
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon test --target js
