name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          export PATH="$HOME/.moon/bin:$PATH"
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          moon version

      - name: Update MoonBit registry
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon update

      - name: Type check
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon check

      - name: Build for JS target
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon build --target js

      - name: Run tests
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon test --target js
