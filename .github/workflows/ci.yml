name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      # 官方国际镜像 cli.moonbitlang.com 当前仅对中国大陆返回 403，
      # 改用国内镜像 cli.moonbitlang.cn 解决下载问题；
      # 同时去掉固定版本 0.1.20260529（该版本在两个镜像均已下架），
      # 改用 latest 拉取最新稳定版。
      - name: Install MoonBit CLI
        env:
          MOONBIT_INSTALL_VERSION: "latest"
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash

      - name: Verify MoonBit installation
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon version --all

      - name: Update MoonBit registry
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon update

      # 1. moon check — 静态类型检查（--deny-warn 把 warning 视为 error）
      - name: Check (type) — moon check --deny-warn
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon check --target js --deny-warn

      # 2. moon fmt — 格式检查
      # 注：MoonBit 最新工具链的 `moon fmt` 不支持 --deny-warn，
      #     但 `moon fmt --check` 在格式不合规时返回非 0，效果等价。
      - name: Format check — moon fmt --check
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon fmt --check

      # 3. moon info — 生成 .mbti 接口文件
      # 注：`moon info` 不支持 --deny-warn；执行后接口文件保持与源码一致。
      - name: Generate interface — moon info
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon info

      # 4. moon test — 运行 267 个测试用例
      - name: Run tests — moon test
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon test --target js

      - name: Build for JS target
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon build --target js
