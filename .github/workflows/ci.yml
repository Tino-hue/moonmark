name: CI

# =============================================================================
# 主 CI — 所有 push 到 main / release / hotfix 和 PR 的质量门禁
# 相比原版本，增强了：
#   - 示例项目回归测试（3 个示例健康分阈值验证）
#   - 自审计（depsight audit --fail-on-score 80）
#   - SARIF 上传（GitHub Security 标签下可查看）
# =============================================================================

on:
  push:
    branches: [main, "release/*", "hotfix/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write # 上传 SARIF 需要

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # 环境安装 — 与 depsight.yml 完全一致，避免 PATH 写入不一致
      # ------------------------------------------------------------
      - name: Install MoonBit CLI (CN mirror)
        env:
          MOONBIT_INSTALL_VERSION: "latest"
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit + Node
        run: |
          moon version --all
          node --version

      - name: Update MoonBit registry
        run: moon update

      # ------------------------------------------------------------
      # 第 1 关：类型检查
      # 说明：历史上使用 --deny-warn 将警告视为错误，但随着 MoonBit 工具链滚动演进会
      #       新增告警（如 W0020: JS FFI Array 返回弃用为 FixedArray），这类告警需要
      #       工具链支持抑制或提供更稳定替代方案后才能消除。当前策略：允许少数已知
      #       告警通过，阻塞 errors；发布前在 release-check 中审计告警数量。
      - name: 1/6 Type check (JS)
        run: moon check --target js

      # ------------------------------------------------------------
      # 第 2 关：格式检查
      # ------------------------------------------------------------
      - name: 2/6 Format check
        run: moon fmt --check

      # ------------------------------------------------------------
      # 第 3 关：接口文件一致性
      # ------------------------------------------------------------
      - name: 3/6 Generate interface
        run: moon info

      # ------------------------------------------------------------
      # 第 4 关：测试（267+ 用例）
      # ------------------------------------------------------------
      - name: 4/6 Run tests
        run: moon test --target js

      # ------------------------------------------------------------
      # 第 5 关：构建 JS bundle
      # ------------------------------------------------------------
      - name: 5/6 Build JS bundle
        run: moon build --target js

      # ------------------------------------------------------------
      # 第 6 关：示例项目回归测试
      # 说明：每个 example 目录都是独立的 moonbit 包（含自己的 moon.mod）。
      #       通过 `cd` 到对应目录运行 audit，避免 --workspace 误扫整个
      #       depsight 仓库（会把 test/、examples/* 全部纳入，造成误报）。
      # ------------------------------------------------------------
      - name: 6/6 Example regression
        id: regression
        run: |
          DEPSIGHT_BIN="${GITHUB_WORKSPACE}/_build/js/debug/build/depsight.js"
          echo "Using bundle: ${DEPSIGHT_BIN}"
          test -f "${DEPSIGHT_BIN}" || { echo "✗ depsight.js bundle missing"; exit 1; }

          echo ""
          echo "━━━ [6a] healthy_project — 高分且无 critical ━━━"
          ( cd examples/healthy_project && \
            node "${DEPSIGHT_BIN}" audit --fail-on-score 80 --quiet )

          echo ""
          echo "━━━ [6b] outdated_project — 输出合法 JSON，包含包健康分 ━━━"
          ( cd examples/outdated_project && \
            node "${DEPSIGHT_BIN}" audit --json > /tmp/outdated.json ) || true
          # 关键断言：JSON 中含预期的包 ID 节点与 overall_score，证明 scanner 正常
          python3 - <<'PY'
          import json
          with open('/tmp/outdated.json') as f:
              data = json.load(f)
          scores = {s['node_id']: s for s in data.get('health_scores', [])}
          assert 'examples/outdated@1.0.0' in scores, \
              f"missing expected node, got: {list(scores)}"
          overall = data.get('overall_score')
          assert isinstance(overall, (int, float)) and overall >= 80, \
              f"overall_score={overall} should be >= 80"
          print(f"  ✓ examples/outdated@1.0.0 scored {scores['examples/outdated@1.0.0']['total']}/100 (overall {overall})")
          PY

          echo ""
          echo "━━━ [6c] risky_project — 缺失 license 字段应触发 LICENSE-002 ━━━"
          ( cd examples/risky_project && \
            node "${DEPSIGHT_BIN}" audit --json > /tmp/risky.json ) || true
          if grep -q "LICENSE-002" /tmp/risky.json; then
            echo "  ✓ 检测到 LICENSE-002 诊断（moon.mod 无 license 字段）"
          else
            echo "  ✗ 未检测到 LICENSE-002 诊断，回归失败"
            echo "--- JSON 输出节选 ---"
            head -50 /tmp/risky.json
            exit 1
          fi

          echo ""
          echo "✅ 三个示例项目回归测试全部通过"

  # =====================================================================
  # Self-audit job — 依赖 build-and-test 通过后运行
  # =====================================================================
  self-audit:
    name: Self Audit (Depsight audits itself)
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_VERSION: "latest"
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Build depsight
        run: |
          moon update
          moon build --target js

      - name: Run self audit (Terminal + SARIF + HTML)
        run: |
          DEPSIGHT="_build/js/debug/build/depsight.js"
          echo "--- Self audit: terminal ---"
          node "$DEPSIGHT" audit --fail-on-score 80 --fail-on-critical

          echo ""
          echo "--- Self audit: SARIF output ---"
          node "$DEPSIGHT" audit --sarif -o depsight-self.sarif || true

          echo ""
          echo "--- Self audit: HTML report ---"
          node "$DEPSIGHT" audit --html  -o depsight-report.html || true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: depsight-self.sarif
          category: depsight-self-audit
        continue-on-error: true

      - name: Upload HTML report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: depsight-self-audit-report
          path: depsight-report.html
          retention-days: 14
