name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      # International mirror cli.moonbitlang.com returns 403 on GitHub Actions,
      # use CN mirror cli.moonbitlang.cn to fix the download issue;
      # pinned version 0.1.20260529 has been removed from both mirrors, use latest.
      - name: Install MoonBit CLI
        env:
          MOONBIT_INSTALL_VERSION: "latest"
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash

      - name: Verify MoonBit installation
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon version --all

      - name: Update MoonBit registry
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon update

      # 1. moon check - static type check (--deny-warn treats warning as error)
      - name: Check (type) - moon check --deny-warn
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon check --target js --deny-warn

      # 2. moon fmt --check - format check
      # Note: MoonBit latest toolchain does not support --deny-warn on moon fmt;
      #       moon fmt --check returns non-zero on format violation.
      - name: Format check - moon fmt --check
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon fmt --check

      # 3. moon info - generate .mbti interface files
      # Note: moon info does not support --deny-warn; the interface file must remain consistent with source.
      - name: Generate interface - moon info
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon info

      # 4. moon test - run 267 test cases
      - name: Run tests - moon test
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon test --target js

      - name: Build for JS target
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon build --target js