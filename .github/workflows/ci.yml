name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generate:
    name: Generate Parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tree-sitter version
        run: npx tree-sitter --version

      - name: Generate parser
        run: npx tree-sitter generate

      - name: Verify parser files exist
        run: |
          test -f src/parser.c
          test -f src/grammar.json
          test -f src/node-types.json

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Generate parser
        run: npx tree-sitter generate

      - name: Run corpus tests
        run: npx tree-sitter test

      - name: Parse demo file
        run: |
          npx tree-sitter parse examples/demo.mbt || echo "Parse completed with warnings (non-blocking)"
