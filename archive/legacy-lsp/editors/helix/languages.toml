# ============================================================
# MoonHighlight — Helix Editor Configuration
# Place this in ~/.config/helix/languages.toml
# ============================================================

[[language]]
name = "moonbit"
scope = "source.moonbit"
injection-regex = "^(moonbit|mbt)$"
file-types = ["mbt"]
roots = ["moon.mod.json"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 2, unit = "  " }

[language.auto-pairs]
'(' = ')'
'[' = ']'
'{' = '}'
'"' = '"'
"'" = "'"
'`' = '`'
'#|' = '|#'

[language.grammar]
source = { git = "https://github.com/Tino-hue/moonmark.git", subpath = "src", rev = "main" }

# Optional: configure formatter when available
# [language.formatter]
# command = "moon"
# args = ["fmt"]

# Optional: configure LSP when available
# [language-server.moonbit-lsp]
# command = "moonbit-lsp"
# args = []
# [language]
# language-servers = ["moonbit-lsp"]
