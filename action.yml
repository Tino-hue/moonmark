name: MoonBit Depsight Audit
description: Build MoonBit Depsight and run a dependency health audit against your moon.mod
author: Tino-hue
branding:
  icon: shield
  color: green

inputs:
  command:
    description: "depsight 子命令：audit / report / check / tree / outdated / why"
    required: false
    default: audit
  target-pkg:
    description: "目标包路径（默认项目根目录）"
    required: false
    default: "."
  fail-on-score:
    description: "健康分低于该阈值时使 action 失败"
    required: false
    default: ""
  fail-on-critical:
    description: "设为 true 时，发现 Critical 诊断即失败"
    required: false
    default: "false"
  format:
    description: "输出格式：terminal / json / html / sarif / markdown"
    required: false
    default: terminal
  output:
    description: "输出文件路径（如 report.html）"
    required: false
    default: ""
  offline:
    description: "设为 true 时仅使用本地缓存，不请求网络"
    required: false
    default: "false"
  extra-args:
    description: "额外透传给 depsight 的参数"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install MoonBit (mirror chain CN -> INT)
      shell: bash
      run: |
        set -o pipefail
        INSTALL_OK=0
        MIRRORS=(
          "cli.moonbitlang.cn"
          "cli.moonbitlang.com"
        )
        for MIRROR in "${MIRRORS[@]}"; do
          echo "━━━ Installing MoonBit via: https://$MIRROR ━━━"
          if curl \
              --connect-timeout 10 \
              --max-time 180 \
              --retry 3 \
              --retry-delay 3 \
              --retry-connrefused \
              -fsSL "https://$MIRROR/install/unix.sh" | bash; then
            if [ -x "$HOME/.moon/bin/moon" ]; then
              INSTALL_OK=1
              break
            else
              echo "  ✗ mirror $MIRROR: 脚本成功但 moon 二进制不存在，继续尝试下一镜像"
            fi
          else
            echo "  ✗ mirror $MIRROR install failed, trying next mirror (if any)"
          fi
          rm -rf "$HOME/.moon" 2>/dev/null || true
        done

        if [ "$INSTALL_OK" -ne 1 ]; then
          echo "✗ MoonBit CLI 安装失败：所有镜像都不可用"
          exit 1
        fi

        echo "$HOME/.moon/bin" >> $GITHUB_PATH
        echo "✓ moon installed: $($HOME/.moon/bin/moon version)"

    - name: Build MoonBit Depsight
      shell: bash
      run: |
        git clone --depth 1 https://github.com/Tino-hue/moonmark.git "$RUNNER_TEMP/depsight"
        cd "$RUNNER_TEMP/depsight"
        n=0
        until [ $n -ge 3 ]; do
          if moon update; then
            break
          fi
          n=$((n+1))
          echo "  ⚠ moon update 尝试 $n/3 失败，5s 后重试..."
          sleep 5
        done
        [ $n -ge 3 ] && { echo "✗ moon update 连续失败 3 次"; exit 1; }
        moon build --target js

    - name: Run MoonBit Depsight
      shell: bash
      run: |
        DEPSIGHT="$RUNNER_TEMP/depsight/_build/js/debug/build/depsight.js"
        CMD="${{ inputs.command }}"

        # target-pkg 是包含 moon.mod 的工作目录；depsight 以当前目录作为扫描根，
        # 故用 cd 切换，避免依赖 CLI 不存在的 --target-pkg 选项。
        TARGET="${{ inputs.target-pkg }}"
        if [ -n "$TARGET" ] && [ "$TARGET" != "." ]; then
          cd "$TARGET" || { echo "✗ 无法进入 target-pkg: $TARGET"; exit 1; }
        fi

        ARGS=()
        [ -n "${{ inputs.format }}" ] && [ "${{ inputs.format }}" != "terminal" ] && ARGS+=(--"${{ inputs.format }}")
        [ -n "${{ inputs.output }}" ] && ARGS+=(-o "${{ inputs.output }}")
        [ -n "${{ inputs.fail-on-score }}" ] && ARGS+=(--fail-on-score "${{ inputs.fail-on-score }}")
        [ "${{ inputs.fail-on-critical }}" = "true" ] && ARGS+=(--fail-on-critical)
        [ "${{ inputs.offline }}" = "true" ] && ARGS+=(--offline)
        [ -n "${{ inputs.extra-args }}" ] && ARGS+=(${{ inputs.extra-args }})

        echo "━━━ Running: depsight $CMD ${ARGS[*]} ━━━"
        node "$DEPSIGHT" "$CMD" "${ARGS[@]}"
